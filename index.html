<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ClearAnEstate.com connects probate executors, attorneys, and families with insured estate cleanout, senior move management, junk removal, and estate sale liquidation professionals nationwide." />
    <meta name="theme-color" content="#d97706" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>ClearAnEstate.com | Estate Cleanout & Senior Move Directory</title>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
